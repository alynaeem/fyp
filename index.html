<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dark Pulse - OSINT Dashboard</title>
  <meta name="description" content="Live DarkPulse intelligence dashboard for leaks, compromised monitoring, exploits, and threat reporting." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css?v=44" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap/dist/css/jsvectormap.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/jsvectormap"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsvectormap/dist/maps/world.js"></script>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <div class="app-wrapper hidden" id="appWrapper">
    <template data-partial="sidebar.html"></template>

    <main class="app-content">
      <template data-partial="header.html"></template>

      <div class="content-body" id="contentBody">
        <template data-partial="command-center.html"></template>
        <template data-partial="feed.html"></template>
        <template data-partial="admin-users.html"></template>
        <template data-partial="national-identity.html"></template>
        <template data-partial="credential-checker.html"></template>
        <template data-partial="confidential-data.html"></template>
        <template data-partial="seo-checker.html"></template>
        <template data-partial="playstore.html"></template>
        <template data-partial="pc-game-scan.html"></template>
        <template data-partial="repo-scan.html"></template>
        <template data-partial="healing-monitor.html"></template>
        <template data-partial="leak-source-status.html"></template>
        <template data-partial="docs.html"></template>
        <template data-partial="account.html"></template>
      </div>
    </main>
  </div>

  <template data-partial="auth-modals.html"></template>
  <template data-partial="shared-modals.html"></template>

  <script type="module">
    const partialTemplates = Array.from(document.querySelectorAll("template[data-partial]"));

    async function loadPartial(template) {
      const name = template.dataset.partial;
      const response = await fetch(`/partials/${name}`);
      if (!response.ok) {
        throw new Error(`Failed to load partial: ${name}`);
      }
      template.outerHTML = await response.text();
    }

    try {
      await Promise.all(partialTemplates.map(loadPartial));
      await import("./app.js?v=58");
    } catch (error) {
      console.error(error);
      document.body.insertAdjacentHTML(
        "beforeend",
        `<div class="test-result" style="position:fixed;left:16px;bottom:16px;z-index:9999;max-width:420px;">DarkPulse failed to load UI components: ${error.message}</div>`
      );
    }
  </script>
</body>
</html>
